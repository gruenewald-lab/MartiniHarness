# Solvation free energy of row42 in three solvents.
#
#   martini_harness run examples/sample_campaign.yaml --dry-run
#   martini_harness run examples/sample_campaign.yaml
#
# Relative paths are resolved against the directory of this file.

title: Sample Martini solvation campaign
output_dir: ../campaigns/sample

# Optional; both default to the files shipped with martini_harness.
# forcefield_dir: path/to/gmx_files
# mdp_dir: path/to/mdp_files

# Force-field ITPs included in every topology, relative to forcefield_dir.
topology:
  includes:
    - martini_v3.0.0.itp
    - martini_v3.0.0_solvents_v1.itp

# Target molecules that are not part of the force-field includes.
molecules:
  row42: row42.itp

# Solvent mixtures, usable as a matrix `solvent`. Amounts are relative; the
# n_solvent molecules are divided over the components. Wet octanol: 920 OCO
# per 80 W, i.e. ~26 mol% water when one W stands for four water molecules.
solvents:
  wetOCO: {OCO: 920, W: 80}

# Defaults for every simulation; any of these can be set per matrix entry.
simulation:
  name: "{target}_in_{solvent}"
  n_target: 1
  n_solvent: 8000
  density: 900.0

# Build matrix with GitHub Actions semantics: the product of all axes, minus
# `exclude`, extended by `include`. Every key becomes a template variable.
matrix:
  target: [row42]
  solvent: [W, wetOCO, CLF]
  include:
    - solvent: W
      density: 997.0
    - solvent: wetOCO
      density: 827.0
    - solvent: CLF
      n_solvent: 6000
      density: 1480.0

# mdrun flags for every stage except energy minimizations (steep/cg/l-bfgs).
# A stage's own `mdrun` flags win. Changing these does not rerun finished steps.
# mdrun:
#   bonded: gpu
#   ntomp: 8
#   ntmpi: 1

# The pipeline, run in order after topology and coordinate generation.
# Each stage takes the .gro file of the previous stage unless `input` is set.
stages:
  - name: min
    mdp: min.mdp
  - name: eq
    mdp: eq.mdp
    maxwarn: 2          # Berendsen thermostat/barostat warnings
  - name: awh
    mdp: awh.mdp
    substitute:
      TOCOUPLE: "{target}"
    mdp_params:
      define: ""        # row42 has no TI-specific terms (awh.mdp sets -DTI)

# Run with `martini_harness analyze`, in every simulation whose stage finished.
# The result of each simulation goes into <output_dir>/<name>.tsv.
analyses:
  - name: dG
    stage: awh
    # {tmpdir} is a scratch directory; gmx awh writes awh_t<time>.xvg per frame.
    command: gmx awh -s awh.tpr -f awh.edr -o {tmpdir}/awh
    # The PMF at the end of the run, one line per lambda state.
    output: "{tmpdir}/awh_t{end_time}.xvg"
    # Solvation free energy (kJ/mol) = PMF(coupled) - PMF(decoupled). The PMF is
    # normalised to a minimum of 0, so the last value alone is not the free energy.
    # In awh.mdp vdw_lambdas runs from 1 (state 0, coupled) to 0 (last state,
    # decoupled), hence first - last. Use last-first if your lambdas run 0 -> 1.
    result: first-last
    columns: [dG_solv]
