# Sample campaign configuration for martini_harness
# This demonstrates running simulations for multiple target molecules with different solvents
# Run with: python -m martini_harness run sample_campaign.yaml

title: "Sample Martini Simulation Campaign"
output_base: "./campaigns/output"

# Optional: override GROMACS force field path (defaults to package data)
gromacs_path: "/home/fgruenewald/ProgramDev/MartiniHarness/data/gmx_files/"

# Optional: override MDP files directory (defaults to package data)
mdp_directory: "./data/mdp_files"

simulations:
  # Simulate a single molecule in OCO solvent
  - name: "row42_in_OCO"
    target_molecule: "row42"
    solvent: "OCO"
    n_target: 1
    n_solvent: 8000
    density: 900.0

  # Simulate the same molecule in water (W)
  - name: "row42_in_W"
    target_molecule: "row42"
    solvent: "W"
    n_target: 1
    n_solvent: 8000
    density: 997.0

  # Simulate in chloroform (CLF) with different density
  - name: "row42_in_CLF"
    target_molecule: "row42"
    solvent: "CLF"
    n_target: 1
    n_solvent: 6000
    density: 815.0

  # Multiple targets example
  - name: "multiple_targets_water"
    target_molecule: "row42"
    solvent: "W"
    n_target: 4
    n_solvent: 8000
    density: 997.0
